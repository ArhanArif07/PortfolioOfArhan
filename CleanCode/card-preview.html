<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>card preview</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fff;padding:40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:1200px;margin:0 auto}
.card{position:relative;border-radius:20px;overflow:hidden;border:1px solid #e6e1dc;background:linear-gradient(155deg,rgb(252,252,252) 0%,rgb(255,247,242) 55%,rgb(255,233,220) 100%)}
.frame{position:absolute;inset:0;overflow:hidden}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.frame img.photo{object-fit:cover}
.meta{padding:18px 20px 22px}
.meta b{display:block;font-size:20px;letter-spacing:-0.03em}
.meta span{font-size:12px;color:#6f6f6f;text-transform:uppercase;letter-spacing:0.14em}
</style>
</head>
<body>
<div class="grid">
  <div class="card"><div class="frame"><img src="/assets/projects/beacon-career-logo.webp" alt=""></div><div class="meta"><b>Beacon Career</b><span>Web App</span></div></div>
  <div class="card"><div class="frame"><img class="photo" src="/assets/projects/sindh-sweets-aligarh-photo.webp" alt=""></div><div class="meta"><b>Sindh Sweets Aligarh</b><span>Business Website</span></div></div>
  <div class="card"><div class="frame"><img src="/assets/projects/indian-coffee-brewery-logo.webp" alt=""></div><div class="meta"><b>Indian Coffee Brewery</b><span>Business Website</span></div></div>
  <div class="card"><div class="frame"><img src="/assets/projects/velio-labs-logo.webp" alt=""></div><div class="meta"><b>Velio Labs</b><span>Business Website</span></div></div>
</div>
<script>
document.querySelectorAll('.card').forEach(function(card){
  var img=card.querySelector('img');
  var frame=card.querySelector('.frame');
  card.style.paddingTop=(img.naturalHeight/img.naturalWidth*100)+'%';
  frame.style.position='relative';frame.style.display='block';frame.style.paddingTop=(img.naturalHeight/img.naturalWidth*100)+'%';
  img.style.position='absolute';
});
</script>
</body>
</html>
